<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PHOENIX - Sign In</title>
    <!-- Exact Google Fonts matching reference: Playfair Display / Serif & Plus Jakarta Sans / Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="login-body">

    <div class="login-wrapper">
        <div class="login-card-container">
            
            <!-- Left Panel: Exact reference graphic with Logo, Tagline, & Laptop Workspace -->
            <div class="login-left-panel">
                <img src="assets/left_panel_complete.png" alt="PHOENIX Employee Automation System" class="left-panel-graphic">
            </div>

            <!-- Right Panel: Login Form -->
            <div class="login-right-panel">
                
                <!-- Language Selector -->
                <div class="language-dropdown-wrapper">
                    <button type="button" class="lang-btn" aria-label="Language selection">
                        <svg class="lang-globe-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="10"></circle>
                            <line x1="2" y1="12" x2="22" y2="12"></line>
                            <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
                        </svg>
                        <span>English</span>
                        <svg class="lang-chevron-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="6 9 12 15 18 9"></polyline>
                        </svg>
                    </button>
                </div>

                <!-- Form Area -->
                <div class="login-form-content">
                    <div class="login-heading-area">
                        <h1 class="welcome-heading">Welcome back</h1>
                        <p class="welcome-subtext">Sign in to your PHOENIX workspace.</p>
                    </div>

                    <form id="loginForm" class="auth-form" novalidate>
                        
                        <!-- Work Email -->
                        <div class="input-group">
                            <label for="email" class="field-label">Work Email</label>
                            <div class="input-wrapper">
                                <span class="input-icon">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                                        <rect x="2" y="4" width="20" height="16" rx="2"></rect>
                                        <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path>
                                    </svg>
                                </span>
                                <input type="email" id="email" name="email" class="form-control" placeholder="Enter your work email" required autocomplete="email">
                            </div>
                        </div>

                        <!-- Password -->
                        <div class="input-group">
                            <label for="password" class="field-label">Password</label>
                            <div class="input-wrapper">
                                <span class="input-icon">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                                        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                                    </svg>
                                </span>
                                <input type="password" id="password" name="password" class="form-control password-input" placeholder="Enter your password" autocomplete="current-password">
                                <button type="button" class="toggle-password-btn" aria-label="Toggle password visibility" onclick="togglePasswordVisibility()">
                                    <svg class="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                                        <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                                        <line x1="1" y1="1" x2="23" y2="23"></line>
                                    </svg>
                                </button>
                            </div>
                        </div>

                        <!-- Remember Me & Forgot Password -->
                        <div class="form-options-row">
                            <label class="checkbox-container">
                                <input type="checkbox" id="rememberMe">
                                <span class="custom-checkbox"></span>
                                <span class="checkbox-text">Remember me</span>
                            </label>
                            <a href="javascript:void(0)" class="forgot-password-link">Forgot password?</a>
                        </div>

                        <!-- Sign In Button -->
                        <button type="submit" class="btn-sign-in">Sign In</button>
                    </form>

                    <!-- Error Alert -->
                    <div id="errorMessage" class="error-message"></div>

                    <!-- Security Note -->
                    <div class="auth-security-footer">
                        <svg class="lock-small-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                        </svg>
                        <span>Authorized company users only.</span>
                    </div>

                </div>
            </div>

        </div>
    </div>

    <script>
        function togglePasswordVisibility() {
            const pwd = document.getElementById('password');
            if (pwd.type === 'password') {
                pwd.type = 'text';
            } else {
                pwd.type = 'password';
            }
        }
    </script>
    <script src="js/main.js"></script>
</body>
</html>
