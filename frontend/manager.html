<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PHOENIX - Project Manager</title>
    <!-- Google Fonts: Inter and Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="manager-container">
        <div class="manager-header">
            <div class="logo-wrapper" style="justify-content: center; margin-bottom: 8px;">
                <div class="logo-icon-container" style="width: 38px; height: 38px; margin-bottom: 0;">
                    <svg class="logo-icon-svg" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <defs>
                            <linearGradient id="mgrPhoenixGrad" x1="6" y1="42" x2="42" y2="6" gradientUnits="userSpaceOnUse">
                                <stop offset="0%" stop-color="#145663"/>
                                <stop offset="45%" stop-color="#1a6f7d"/>
                                <stop offset="80%" stop-color="#2ba3b5"/>
                                <stop offset="100%" stop-color="#38c5d9"/>
                            </linearGradient>
                            <linearGradient id="mgrPhoenixWing" x1="12" y1="36" x2="36" y2="12" gradientUnits="userSpaceOnUse">
                                <stop offset="0%" stop-color="#2ba3b5" stop-opacity="0.3"/>
                                <stop offset="100%" stop-color="#ffffff" stop-opacity="0.9"/>
                            </linearGradient>
                        </defs>
                        <path d="M24 4C24.8 9.5 28.5 14 34 16C29 18 26.5 21 26 26C28.5 23 32.5 22.5 36 24C31 27.5 28 32.5 27.5 39C25.5 34 22 30 17 28C21 26.5 23 23.5 23 19C19 21.5 14.5 21 11 18C16.5 15.5 21.5 11 24 4Z" fill="url(#mgrPhoenixGrad)"/>
                        <path d="M24 8C24.5 12 27.5 15.5 31.5 17C27.5 18.5 25.5 21 25 25C27 22.5 30 22 33 23.5C29 26 26.5 30 26 35C24.5 31 22 28 18 26.5C21 25.5 22.5 23 22.5 19.5C19.5 21.5 16 21 13 18.5C17.5 16.5 21.5 13 24 8Z" fill="url(#mgrPhoenixWing)"/>
                    </svg>
                </div>
                <div class="manager-logo">PHOENIX</div>
            </div>
            <h1 class="manager-title">Project Manager Dashboard</h1>
        </div>

        <div class="manager-card">
            <div class="card-header-flex">
                <h2 class="manager-card-title">Assign New Task</h2>
                <button type="button" id="openAddEmployeeBtn" class="btn-secondary-outline">+ Add Employee</button>
            </div>

            <form id="taskForm">
                <div class="manager-form-group">
                    <label for="employee">Employee</label>
                    <select id="employee" name="employee" required>
                        <option value="">Loading employees...</option>
                    </select>
                </div>

                <div class="manager-form-group">
                    <label for="task">Task</label>
                    <input type="text" id="task" name="task" placeholder="Enter task description" required>
                </div>

                <div class="manager-form-group">
                    <label for="deadline_date">Deadline Date</label>
                    <input type="date" id="deadline_date" name="deadline_date" required>
                </div>

                <div class="manager-form-group">
                    <label for="deadline_time">Deadline Time</label>
                    <input type="time" id="deadline_time" name="deadline_time" required>
                </div>

                <button type="submit" class="manager-btn">ASSIGN TASK</button>
            </form>

            <div class="manager-status">
                <p id="statusText">● Ready</p>
            </div>

            <div id="feedbackMessage" class="manager-feedback"></div>
        </div>

        <!-- Add Employee Modal -->
        <div id="addEmployeeModal" class="modal-backdrop" style="display: none;">
            <div class="manager-card modal-card">
                <h2 class="manager-card-title" style="text-align: left; margin-bottom: 20px;">Add New Employee</h2>
                <form id="addEmployeeForm">
                    <div class="manager-form-group">
                        <label for="empName">Name</label>
                        <input type="text" id="empName" placeholder="e.g. Rahul Sharma" required>
                    </div>
                    <div class="manager-form-group">
                        <label for="empEmail">Gmail</label>
                        <input type="email" id="empEmail" placeholder="e.g. rahulsharma@gmail.com" required>
                    </div>
                    <div class="manager-form-group">
                        <label for="empDept">Department</label>
                        <input type="text" id="empDept" placeholder="e.g. Engineering" required>
                    </div>
                    <div id="addEmpFeedback" class="manager-feedback"></div>
                    <div class="modal-actions">
                        <button type="submit" class="manager-btn modal-submit-btn">Add Employee</button>
                        <button type="button" id="cancelAddEmployeeBtn" class="btn-cancel">Cancel</button>
                    </div>
                </form>
            </div>
        </div>

        <div class="manager-footer">
            <button onclick="window.location.href='index.html'" class="manager-btn-logout">LOGOUT</button>
        </div>
    </div>

    <script src="js/manager.js"></script>
</body>
</html>
